
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heliora
      POSTGRES_PASSWORD: heliora
      POSTGRES_DB: heliora
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
