# Heliora admin control plane (served under /admin). Scales to zero when idle.
app = "heliora-monjar-admin"
primary_region = "lhr"

[build]
  dockerfile = "apps/admin/Dockerfile"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
